name: Verificación
on: [push, pull_request]
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jg_ci
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: jg_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jg_ci -d jg_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.lock && pip install --no-deps -e ./backend
      - run: pytest -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://jg_ci:isolated-ci-password@localhost:5432/jg_tests
      - run: npm ci && npm test && npm run build
        working-directory: frontend
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/configure.py
      - run: docker compose config --quiet && docker compose up --build --wait
      - run: curl --fail http://localhost:8000/api/v1/ready && curl --fail http://localhost:8080/api/v1/ready && curl --fail http://localhost:8080/
      - if: always()
        run: docker compose logs --no-color && docker compose down
