services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: jg_repuestos
      POSTGRES_USER: jg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecute python scripts/configure.py}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jg -d jg_repuestos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://jg:${POSTGRES_PASSWORD}@db:5432/jg_repuestos
      JWT_SECRET: ${JWT_SECRET:?Ejecute python scripts/configure.py}
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: '["http://localhost:8080","http://localhost:5173","http://127.0.0.1:8080","http://127.0.0.1:5173"]'
      APP_ENV: development
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    environment: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
