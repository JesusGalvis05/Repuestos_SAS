# Solo recursos temporales de CI. No reutiliza el Compose ni el volumen de desarrollo.
services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: jg_ci
      POSTGRES_DB: jg_ci
      POSTGRES_PASSWORD: ${CI_POSTGRES_PASSWORD:?Configuracion temporal requerida}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jg_ci -d jg_ci"]
      interval: 2s
      timeout: 5s
      retries: 60
    networks: [ci-network]

  tests:
    image: ${CI_TEST_IMAGE:?Etiqueta temporal requerida}
    build:
      context: ../backend
      target: test
    environment: &api-environment
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: jg_ci
      POSTGRES_DB: jg_ci
      POSTGRES_PASSWORD: ${CI_POSTGRES_PASSWORD}
      JWT_SECRET: ${CI_JWT_SECRET:?Configuracion temporal requerida}
      DOCKER_RUNTIME: "true"
      APP_ENV: test
      COOKIE_SECURE: "false"
      RUN_DOCKER_COMMUNICATION: "1"
    command: ["sh", "-c", "alembic upgrade head && python -m pytest -q -p no:cacheprovider --junitxml=/tmp/pytest.xml"]
    depends_on:
      db:
        condition: service_healthy
    networks: [ci-network]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  api:
    image: ${CI_RUNTIME_IMAGE:?Etiqueta temporal requerida}
    build:
      context: ../backend
      target: runtime
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      start_period: 20s
      interval: 2s
      timeout: 5s
      retries: 60
    networks: [ci-network]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  ci-network:
    driver: bridge
