name: jg-repuestos

services:
  api:
    image: jg-repuestos-api:academic
    build:
      context: ./backend
      target: runtime
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Ejecute python scripts/configure.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecute python scripts/configure.py}
      POSTGRES_DB: ${POSTGRES_DB:?Ejecute python scripts/configure.py}
      JWT_SECRET: ${JWT_SECRET:?Ejecute python scripts/configure.py}
      DOCKER_RUNTIME: "true"
      APP_ENV: ${APP_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:5173","http://localhost:8000","http://127.0.0.1:5173","http://127.0.0.1:8000"]}'
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - jg-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Ejecute python scripts/configure.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecute python scripts/configure.py}
      POSTGRES_DB: ${POSTGRES_DB:?Ejecute python scripts/configure.py}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

networks:
  jg-network:
    name: jg-network
    driver: bridge

volumes:
  postgres_data:
